{% extends 'base.html' %}{% block title %}Update problem status{% endblock %}{% block content %}<section class="form-page"><a class="back-link" href="{{ url_for('problem_detail', problem_id=problem.id) }}">← Back to problem</a><div class="eyebrow">KEEP THE COMMUNITY UPDATED</div><h1>Update the <em>status.</em></h1><p class="form-intro">Only the person who created this post can change its status.</p><form method="post" class="problem-form"><input type="hidden" name="_csrf_token" value="{{ csrf_token() }}"><div class="field-grid"><label class="field-wide">Problem / event<select name="status" required>{% for st in ['Open','In Progress','Resolved'] %}<option value="{{ st }}" {% if problem.status==st %}selected{% endif %}>{{ st }}</option>{% endfor %}</select><small class="field-hint">Open: help is needed. In Progress: someone is working on it. Resolved: the need has been addressed.</small></label></div><div class="form-actions"><a class="button button-quiet" href="{{ url_for('problem_detail', problem_id=problem.id) }}">Cancel</a><button class="button button-primary" type="submit">Save status ↗</button></div></form></section>{% endblock %}
